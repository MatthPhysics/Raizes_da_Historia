spring:
  application:
    name: raizes-da-historia
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raizes_da_historia}
    username: ${DB_USER:raizes}
    password: ${DB_PASSWORD:raizes_dev}
  jpa:
    hibernate:
      ddl-auto: validate        # o schema é responsabilidade EXCLUSIVA do Flyway
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 20
        serialization-mode: via-dto   # Page serializada como {content, page}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

raizes:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}
  admin-inicial:
    nome: ${ADMIN_INICIAL_NOME:}
    email: ${ADMIN_INICIAL_EMAIL:}
    senha: ${ADMIN_INICIAL_SENHA:}
  login:
    max-tentativas-por-minuto: 5
  imagens:
    diretorio: ${IMAGENS_DIRETORIO:uploads/plantas}
    url-base: /imagens/plantas

pix:
  provedor: ${PIX_PROVEDOR:mock}
  chave: ${PIX_CHAVE:}
  expiracao-minutos: 30
  webhook-secret: ${PIX_WEBHOOK_SECRET:}
  expiracao-job-intervalo-ms: 60000
  recebedor-nome: ${PIX_RECEBEDOR_NOME:RAIZES DA HISTORIA}
  recebedor-cidade: ${PIX_RECEBEDOR_CIDADE:SAO PAULO}
  # Usado apenas com pix.provedor=psp (PSP real, a definir)
  psp:
    base-url: ${PIX_PSP_BASE_URL:}
    token-path: ${PIX_PSP_TOKEN_PATH:/oauth/token}
    client-id: ${PIX_PSP_CLIENT_ID:}
    client-secret: ${PIX_PSP_CLIENT_SECRET:}
    ssl-bundle: ${PIX_PSP_SSL_BUNDLE:}
